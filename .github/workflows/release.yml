name: Release

# Publishes a GitHub release with CLI binaries for each platform and the VS
# Code extension, and publishes the extension to the VS Code Marketplace with
# the publisher's token in the VSCE_PAT secret. Either push a tag like v0.2.0
# that matches the root package.json version, or run this workflow by hand on
# a branch: it then releases that branch's package.json version and creates
# the tag itself.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected=$(bun -p 'require("./package.json").version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$expected" ]; then
              echo "::error::tag $GITHUB_REF_NAME doesn't match package.json version $expected"
              exit 1
            fi
          else
            version="$expected"
            if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::v$version is already released; bump the version in package.json"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun run ci
      - run: bun scripts/build-release.ts "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/*
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.platform }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: darwin-arm64, os: macos-latest }
          - { platform: darwin-x64, os: macos-15-intel }
          - { platform: windows-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: examples
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Unpack
        shell: bash
        run: |
          cd release
          name="encantis-${{ needs.build.outputs.version }}-${{ matrix.platform }}"
          if [ -f "$name.zip" ]; then unzip -q "$name.zip"; else tar -xzf "$name.tar.gz"; fi
          exe=encantis; [ -f "$name.zip" ] && exe=encantis.exe
          echo "BIN=$PWD/$name/$exe" >> "$GITHUB_ENV"
      - name: Run
        shell: bash
        run: |
          "$BIN" --version | grep -F "${{ needs.build.outputs.version }}"
          "$BIN" test examples/data/crit-bit/crit-bit.ents
          "$BIN" wasm -O examples/alloc/stack.ents -o stack.wasm
          test -s stack.wasm
          # binaryen runs inside the binary: a release build twice gives the
          # same bytes, no larger than -O's
          "$BIN" wasm --release --size examples/alloc/stack.ents -o release.wasm
          "$BIN" wasm --release examples/alloc/stack.ents -o again.wasm
          cmp release.wasm again.wasm
          test "$(wc -c < release.wasm)" -le "$(wc -c < stack.wasm)"
          # The language server answers on stdout and ends when told to. stdin
          # is held open after exit is sent, as a client holds it: the server
          # exits when it closes, whatever it has not yet handled.
          msg() { printf 'Content-Length: %d\r\n\r\n%s' "${#1}" "$1"; }
          { msg '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"processId":null,"rootUri":null,"capabilities":{}}}'
            msg '{"jsonrpc":"2.0","id":2,"method":"shutdown"}'
            msg '{"jsonrpc":"2.0","method":"exit"}'
            sleep 5; } | "$BIN" lsp > lsp.out
          grep -F '"hoverProvider":true' lsp.out

  publish:
    name: Publish
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # A pushed tag already exists; a manual run creates it at this commit.
          if [ "$GITHUB_REF_TYPE" = tag ]; then target="--verify-tag"; else target="--target $GITHUB_SHA"; fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Encantis ${TAG#v}" \
            --generate-notes \
            $target $prerelease

  # The extension's upload is a job of its own: once the GitHub release
  # exists (it cannot be made again), a failed upload is retried by
  # re-running this job alone. A version already there is skipped.
  marketplace:
    name: Marketplace
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Publish the VS Code extension to the Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # The Marketplace takes no prerelease versions, and without the
          # publisher's token there is nothing to publish with.
          case "$VERSION" in *-*) echo "$VERSION is a prerelease: not published"; exit 0 ;; esac
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set: the extension was not published to the Marketplace"
            exit 0
          fi
          npx --yes @vscode/vsce@3.7.1 publish --packagePath "release/encantis-vscode-$VERSION.vsix" --skip-duplicate
